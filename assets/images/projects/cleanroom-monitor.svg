<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">

<defs>
  <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#06b6d4' />
    <stop offset='100%' stop-color='#3b82f6' />
  </linearGradient>
  <linearGradient id='amberGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#f59e0b' />
    <stop offset='100%' stop-color='#ef4444' />
  </linearGradient>
  <linearGradient id='chipGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#1e293b' />
    <stop offset='100%' stop-color='#0f172a' />
  </linearGradient>
  <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
    <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#1e293b' stroke-width='0.5'/>
  </pattern>
</defs>

  <rect width="800" height="450" fill="#080e1a" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <text x="40" y="45" font-family="monospace" font-size="13" fill="#10b981" letter-spacing="2">[ INDUSTRIAL IOT // MULTI-SENSOR ENVIRONMENTAL ACQUISITION ]</text>
  <text x="40" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Semiconductor Cleanroom Smart Safety System</text>

  <!-- Central ESP32 Hub -->
  <g transform="translate(300, 130)">
    <rect width="200" height="220" rx="12" fill="url(#chipGrad)" stroke="#10b981" stroke-width="2.5" />
    <rect x="15" y="15" width="170" height="30" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="100" y="35" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">ESP32 SOC CORE</text>
    <text x="100" y="70" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Dual Xtensa LX6 @ 240MHz</text>
    <text x="100" y="95" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">I2C Master Engine (BMP085)</text>
    <text x="100" y="120" font-family="monospace" font-size="10" fill="#fed7aa" text-anchor="middle">ADC 12-Bit CT Current</text>
    <text x="100" y="145" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">GPIO ISR (Vibration/Door)</text>
    <text x="100" y="170" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">DHT11 Heat Index Logic</text>
    <text x="100" y="195" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">HTTPS / TLS WiFi Telemetry</text>
  </g>

  <!-- Left Sensors -->
  <g transform="translate(50, 110)">
    <rect width="170" height="60" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#06b6d4">BMP085 Barometer</text>
    <text x="15" y="47" font-family="sans-serif" font-size="10" fill="#94a3b8">Cleanroom Air Pressure</text>
    <path d="M 170 30 L 300 170" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" />

    <rect y="80" width="170" height="60" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="107" font-family="monospace" font-size="11" font-weight="bold" fill="#60a5fa">DHT11 Sensor</text>
    <text x="15" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8">Humidity &amp; Heat Index</text>
    <path d="M 170 110 L 300 210" stroke="#3b82f6" stroke-width="1.5" />

    <rect y="160" width="170" height="60" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="187" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24">MQ-135 Gas &amp; VOC</text>
    <text x="15" y="207" font-family="sans-serif" font-size="10" fill="#94a3b8">Toxic Vapor Detection</text>
    <path d="M 170 190 L 300 250" stroke="#f59e0b" stroke-width="1.5" />
  </g>

  <!-- Right Sensors & Cloud -->
  <g transform="translate(580, 110)">
    <rect width="170" height="60" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="15" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#f472b6">Vibration SW-420</text>
    <text x="15" y="47" font-family="sans-serif" font-size="10" fill="#94a3b8">Machinery Vibration</text>
    <path d="M 0 30 L -80 170" stroke="#ec4899" stroke-width="1.5" />

    <rect y="80" width="170" height="60" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <text x="15" y="107" font-family="monospace" font-size="11" font-weight="bold" fill="#fde047">Current CT Sensor</text>
    <text x="15" y="127" font-family="sans-serif" font-size="10" fill="#94a3b8">HVAC Equipment Load</text>
    <path d="M 0 110 L -80 210" stroke="#eab308" stroke-width="1.5" />

    <rect y="160" width="170" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="15" y="187" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">IoT Cloud Dashboard</text>
    <text x="15" y="207" font-family="sans-serif" font-size="10" fill="#94a3b8">Real-time Graphs &amp; Alerts</text>
    <path d="M 0 190 L -80 250" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />
  </g>
</svg>