<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">

<defs>
  <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#06b6d4' />
    <stop offset='100%' stop-color='#3b82f6' />
  </linearGradient>
  <linearGradient id='amberGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#f59e0b' />
    <stop offset='100%' stop-color='#ef4444' />
  </linearGradient>
  <linearGradient id='chipGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#1e293b' />
    <stop offset='100%' stop-color='#0f172a' />
  </linearGradient>
  <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
    <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#1e293b' stroke-width='0.5'/>
  </pattern>
</defs>

  <rect width="800" height="450" fill="#080e1a" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <text x="40" y="45" font-family="monospace" font-size="13" fill="#ef4444" letter-spacing="2">[ SAFETY-CRITICAL AUTOMOTIVE SYSTEM // SUB-MILLISECOND ISR ]</text>
  <text x="40" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Automotive Crash Detection &amp; Airbag Controller</text>

  <!-- Sensors -->
  <g transform="translate(60, 140)">
    <rect width="180" height="170" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="90" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">CRASH SENSORS</text>
    <text x="90" y="60" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Impact Deceleration</text>
    <text x="90" y="85" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">G-Force Peak Threshold</text>
    <text x="90" y="110" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Frontal Collision Array</text>
    <text x="90" y="135" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">Sampling: &gt;1kHz</text>
  </g>

  <line x1="240" y1="225" x2="290" y2="225" stroke="#f59e0b" stroke-width="3" />

  <!-- MCU Core -->
  <g transform="translate(290, 125)">
    <rect width="220" height="200" rx="10" fill="url(#chipGrad)" stroke="#ef4444" stroke-width="2.5" />
    <rect x="15" y="15" width="190" height="30" rx="4" fill="#ef4444" fill-opacity="0.2" />
    <text x="110" y="35" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">SAFETY CONTROLLER</text>
    <text x="110" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Hardware Interrupt (INT0)</text>
    <text x="110" y="95" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Latency: &lt; 2.5 Milliseconds</text>
    <text x="110" y="120" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Crash Qualification Logic</text>
    <text x="110" y="145" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">Redundant Validation Check</text>
    <rect x="15" y="160" width="190" height="25" rx="4" fill="#b91c1c" />
    <text x="110" y="177" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">FIRE INITIATION</text>
  </g>

  <line x1="510" y1="225" x2="560" y2="225" stroke="#ef4444" stroke-width="3" />

  <!-- Actuation -->
  <g transform="translate(560, 140)">
    <rect width="180" height="170" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="90" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">ACTUATION &amp; BEACON</text>
    <text x="90" y="60" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Solenoid Deployment</text>
    <text x="90" y="85" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">High-Output Buzzer Alert</text>
    <text x="90" y="110" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">CAN Telemetry Distress</text>
    <text x="90" y="135" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">Fuel Pump Cutoff Command</text>
  </g>
</svg>