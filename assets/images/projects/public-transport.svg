<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">

<defs>
  <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#06b6d4' />
    <stop offset='100%' stop-color='#3b82f6' />
  </linearGradient>
  <linearGradient id='amberGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#f59e0b' />
    <stop offset='100%' stop-color='#ef4444' />
  </linearGradient>
  <linearGradient id='chipGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#1e293b' />
    <stop offset='100%' stop-color='#0f172a' />
  </linearGradient>
  <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
    <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#1e293b' stroke-width='0.5'/>
  </pattern>
</defs>

  <rect width="800" height="450" fill="#080e1a" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <text x="40" y="45" font-family="monospace" font-size="13" fill="#3b82f6" letter-spacing="2">[ 433MHz WIRELESS RF BUS // DUAL-STATION TELEMETRY ]</text>
  <text x="40" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Smart Public Transport Seat &amp; Tracking Framework</text>

  <!-- Bus Unit -->
  <g transform="translate(70, 130)">
    <rect width="270" height="230" rx="10" fill="url(#chipGrad)" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="15" width="240" height="28" rx="4" fill="#3b82f6" fill-opacity="0.2" />
    <text x="135" y="34" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">BUS ONBOARD UNIT (ESP32)</text>
    <text x="20" y="70" font-family="monospace" font-size="11" fill="#cbd5e1">• Dual Ultrasonic Counter</text>
    <text x="20" y="95" font-family="monospace" font-size="11" fill="#cbd5e1">• IR Optical Seat Sensor Array</text>
    <text x="20" y="120" font-family="monospace" font-size="11" fill="#cbd5e1">• Servo Automatic Door Control</text>
    <text x="20" y="145" font-family="monospace" font-size="11" fill="#cbd5e1">• Passenger Flow State Machine</text>
    <rect x="15" y="170" width="240" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" />
    <text x="135" y="190" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">433MHz RF Transmitter</text>
    <text x="135" y="205" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">TX: Live Occupancy Packet</text>
  </g>

  <!-- RF Waves Center -->
  <g transform="translate(375, 210)">
    <path d="M 0 10 A 20 20 0 0 1 0 50" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path d="M 15 0 A 35 35 0 0 1 15 60" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M 30 -10 A 50 50 0 0 1 30 70" fill="none" stroke="#06b6d4" stroke-width="2.5" />
    <text x="25" y="95" font-family="monospace" font-size="11" fill="#06b6d4" text-anchor="middle">433 MHz RF</text>
    <text x="25" y="112" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">FSK Protocol</text>
  </g>

  <!-- Bus Stop Station Unit -->
  <g transform="translate(460, 130)">
    <rect width="270" height="230" rx="10" fill="url(#chipGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="240" height="28" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="135" y="34" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">BUS STOP STATION UNIT</text>
    <text x="20" y="70" font-family="monospace" font-size="11" fill="#cbd5e1">• 433MHz RF Receiver Module</text>
    <text x="20" y="95" font-family="monospace" font-size="11" fill="#cbd5e1">• 16x2 I2C Display Matrix</text>
    <text x="20" y="120" font-family="monospace" font-size="11" fill="#cbd5e1">• Real-Time Seat Availability</text>
    <text x="20" y="145" font-family="monospace" font-size="11" fill="#cbd5e1">• Full/Vacant Status Indicators</text>
    <rect x="15" y="170" width="240" height="45" rx="6" fill="#1e293b" stroke="#10b981" />
    <text x="135" y="190" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">Instant Station Display</text>
    <text x="135" y="205" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Vacancy: 14 SEATS AVAILABLE</text>
  </g>
</svg>