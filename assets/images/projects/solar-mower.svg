<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">

<defs>
  <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#06b6d4' />
    <stop offset='100%' stop-color='#3b82f6' />
  </linearGradient>
  <linearGradient id='amberGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#f59e0b' />
    <stop offset='100%' stop-color='#ef4444' />
  </linearGradient>
  <linearGradient id='chipGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#1e293b' />
    <stop offset='100%' stop-color='#0f172a' />
  </linearGradient>
  <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
    <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#1e293b' stroke-width='0.5'/>
  </pattern>
</defs>

  <rect width="800" height="450" fill="#080e1a" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <text x="40" y="45" font-family="monospace" font-size="13" fill="#10b981" letter-spacing="2">[ AUTONOMOUS ROBOTICS // ENERGY HARVESTING ]</text>
  <text x="40" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Autonomous Solar-Powered Smart Lawn Mower</text>

  <!-- Solar Power -->
  <g transform="translate(60, 140)">
    <rect width="170" height="180" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2" />
    <text x="85" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">SOLAR POWER</text>
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">• Photovoltaic Panel</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#cbd5e1">• MPPT Regulator</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="#cbd5e1">• 12V LiFePO4 Battery</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#cbd5e1">• DC-DC Step-Down</text>
    <text x="20" y="165" font-family="monospace" font-size="9" fill="#10b981">Energy Budget Management</text>
  </g>

  <line x1="230" y1="230" x2="290" y2="230" stroke="#eab308" stroke-width="2" />

  <!-- MCU -->
  <g transform="translate(290, 130)">
    <rect width="220" height="200" rx="10" fill="url(#chipGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="15" width="190" height="30" rx="4" fill="#10b981" fill-opacity="0.2" />
    <text x="110" y="35" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399" text-anchor="middle">NAVIGATION MCU</text>
    <text x="20" y="75" font-family="monospace" font-size="10" fill="#cbd5e1">• Dual HC-SR04 Ranging</text>
    <text x="20" y="100" font-family="monospace" font-size="10" fill="#cbd5e1">• Collision Avoidance FSM</text>
    <text x="20" y="125" font-family="monospace" font-size="10" fill="#cbd5e1">• Perimeter Boundary Logic</text>
    <text x="20" y="150" font-family="monospace" font-size="10" fill="#cbd5e1">• PWM Dual Speed Control</text>
    <text x="20" y="180" font-family="monospace" font-size="9" fill="#38bdf8">Smart Path Optimization</text>
  </g>

  <line x1="510" y1="230" x2="570" y2="230" stroke="#10b981" stroke-width="2" />

  <!-- Actuation -->
  <g transform="translate(570, 140)">
    <rect width="170" height="180" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <text x="85" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#22d3ee" text-anchor="middle">ACTUATION DRIVE</text>
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">• L298N Dual H-Bridge</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#cbd5e1">• High-Torque Geared DC</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="#cbd5e1">• Rotary Cutter Motor</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#cbd5e1">• Emergency Stall Cutoff</text>
    <text x="20" y="165" font-family="monospace" font-size="9" fill="#10b981">Continuous Autonomous Op</text>
  </g>
</svg>