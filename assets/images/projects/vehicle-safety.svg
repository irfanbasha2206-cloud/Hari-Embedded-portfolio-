<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">

<defs>
  <linearGradient id='cyanGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#06b6d4' />
    <stop offset='100%' stop-color='#3b82f6' />
  </linearGradient>
  <linearGradient id='amberGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#f59e0b' />
    <stop offset='100%' stop-color='#ef4444' />
  </linearGradient>
  <linearGradient id='chipGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
    <stop offset='0%' stop-color='#1e293b' />
    <stop offset='100%' stop-color='#0f172a' />
  </linearGradient>
  <pattern id='grid' width='20' height='20' patternUnits='userSpaceOnUse'>
    <path d='M 20 0 L 0 0 0 20' fill='none' stroke='#1e293b' stroke-width='0.5'/>
  </pattern>
</defs>

  <rect width="800" height="450" fill="#080e1a" />
  <rect width="800" height="450" fill="url(#grid)" />
  
  <text x="40" y="45" font-family="monospace" font-size="13" fill="#f59e0b" letter-spacing="2">[ CONNECTED VEHICLE TELEMATICS // CLOUD EMERGENCY DISPATCH ]</text>
  <text x="40" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">IoT-Based Vehicle Safety Alert &amp; Collision Telematics</text>

  <!-- Left: Sensors -->
  <g transform="translate(60, 140)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <text x="90" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">VEHICLE SENSORS</text>
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">• MQ-135 Gas / Alcohol</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#cbd5e1">• Piezo Vibration Impact</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="#cbd5e1">• Ultrasonic Blindspot</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#cbd5e1">• Ignition Status Relay</text>
    <text x="20" y="165" font-family="monospace" font-size="9" fill="#f59e0b">Driver Impairment Lock</text>
  </g>

  <line x1="240" y1="230" x2="300" y2="230" stroke="#f59e0b" stroke-width="2" />

  <!-- Center: ESP8266 -->
  <g transform="translate(300, 130)">
    <rect width="200" height="200" rx="10" fill="url(#chipGrad)" stroke="#06b6d4" stroke-width="2" />
    <rect x="15" y="15" width="170" height="30" rx="4" fill="#06b6d4" fill-opacity="0.2" />
    <text x="100" y="35" font-family="monospace" font-size="13" font-weight="bold" fill="#22d3ee" text-anchor="middle">ESP8266 / NODEMCU</text>
    <text x="20" y="75" font-family="monospace" font-size="10" fill="#cbd5e1">• Real-Time Threat Eval</text>
    <text x="20" y="100" font-family="monospace" font-size="10" fill="#cbd5e1">• Secure HTTPS Client</text>
    <text x="20" y="125" font-family="monospace" font-size="10" fill="#cbd5e1">• Auto Emergency Trigger</text>
    <text x="20" y="150" font-family="monospace" font-size="10" fill="#cbd5e1">• Engine Lockout Command</text>
    <text x="20" y="180" font-family="monospace" font-size="9" fill="#10b981">Instant Cloud SOS Post</text>
  </g>

  <line x1="500" y1="230" x2="560" y2="230" stroke="#06b6d4" stroke-width="2" />

  <!-- Right: Dispatch -->
  <g transform="translate(560, 140)">
    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
    <text x="90" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#f87171" text-anchor="middle">CLOUD &amp; DISPATCH</text>
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#cbd5e1">• IoTCloud22 API Gateway</text>
    <text x="20" y="90" font-family="monospace" font-size="10" fill="#cbd5e1">• GPS Geo-Coordinates</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="#cbd5e1">• Emergency Services Alert</text>
    <text x="20" y="140" font-family="monospace" font-size="10" fill="#cbd5e1">• Family Emergency SMS</text>
    <text x="20" y="165" font-family="monospace" font-size="9" fill="#ef4444">Sub-3s Response Dispatch</text>
  </g>
</svg>